name: Build AleHead

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APKs bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APKs einsammeln
        run: |
          mkdir out
          cp mobile/build/outputs/apk/debug/mobile-debug.apk out/AleHead-Handy.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/AleHead-Uhr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AleHead-APKs
          path: out/

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/*.apk --title "AleHead (neuester Build)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}" --latest
